name: Validate grant review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression-and-browser:
    runs-on: ubuntu-latest
    env:
      BIGQUERY_MCP_MODE: none
      ADK_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: node --check ADK/js/app.js
      - run: bash -n scripts/deploy.sh deploy_cloud_run.sh
      - run: python tests/browser_smoke.py
      - run: python run_adk_test.py --mode canonical
      - run: python run_adk_test.py --mode local_csv
